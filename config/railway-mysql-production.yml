database:
  type: "mysql"
  mysql:
    host: "${MYSQL_HOST}"
    port: ${MYSQL_PORT:-3306}
    user: "${MYSQL_USER}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE}"
    
    connection_mode: existing
    
    data_filtering:
      schema_discovery: true
      table_whitelist: ["users", "teams", "skills", "projects", "tasks", "team_members", "user_skills", "project_skills", "task_dependencies", "activity_log"]
      table_blacklist: []
      row_limit_per_table: 10000
      query_timeout: 60
    
    security:
      read_only: true
      connection_timeout: 60
      query_timeout: 60
      max_connections: 20
      allow_production_connections: true
      allowed_hosts: ["*"]

neo4j:
  uri: "${NEO4J_URI:-bolt://localhost:7687}"
  user: "${NEO4J_USER:-neo4j}"
  password: "${NEO4J_PASSWORD}"
  max_connection_pool_size: 50
  connection_timeout: 30s
  max_transaction_retry_time: 30s

server:
  port: ${PORT:-3000}
  api_port: ${API_PORT:-8080}
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

performance:
  monitoring:
    enabled: true
    update_interval: "10s"
    data_retention: "2h"
    max_concurrent_queries: 50
    
    performance_schema:
      enabled: true
      statement_limit: 1000
      table_io_limit: 500
      index_limit: 500
      connection_limit: 100
      cache_duration: "60s"
      
    analysis:
      bottleneck_threshold: 70.0
      slow_query_threshold: 500.0
      high_load_threshold: 80.0
      hotspot_threshold: 75.0
      
  realtime:
    enabled: true
    update_interval: "10s"
    heartbeat_interval: "30s"
    max_connections: 500
    write_timeout: "30s"
    read_timeout: "120s"
    ping_timeout: "180s"
    max_message_size: 1024
    compression_enabled: true
    
    alerts:
      high_latency: 2000.0
      high_error_rate: 10.0
      high_cpu_usage: 85.0
      high_memory_usage: 90.0
      slow_query_threshold: 500.0
      deadlock_threshold: 10
      
  benchmarks:
    enabled: false
    
  visualization:
    edge_thickness:
      metric: "query_frequency"
      scale: "linear"
      min_thickness: 2.0
      max_thickness: 15.0
      multiplier: 1.5
      
    edge_color:
      metric: "avg_execution_time"
      color_scale: "green_yellow_red"
      thresholds:
        fast: "< 200ms"
        medium: "200ms - 2s"
        slow: "> 2s"
        
    node_size:
      metric: "total_queries_involved"
      min_size: 25.0
      max_size: 120.0
      scale: "sqrt"
      
    node_color:
      metric: "avg_response_time"
      color_scale: "green_yellow_red"
      thresholds:
        good: "< 100ms"
        ok: "100ms - 500ms"
        slow: "> 500ms"
        
    animation:
      show_data_flow: true
      speed_based_on: "query_frequency"
      animation_speed: 1.2
      particle_count: 20
      
    update_interval: "10s"
    history_retention: "2h"
    max_concurrent_updates: 10

transform_rules:
  - name: "users_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT u.id, u.username, u.email, u.full_name, u.role, u.is_active, CONCAT(u.full_name, ' (', u.role, ')') as display_name FROM users u WHERE u.is_active = 1"
    target_type: "User"
    field_mappings:
      id: "id"
      username: "username"
      email: "email"
      full_name: "name"
      role: "role"
      is_active: "is_active"
      display_name: "display_name"

  - name: "teams_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT t.id, t.name, t.description, u.full_name as lead_name FROM teams t LEFT JOIN users u ON t.team_lead_id = u.id"
    target_type: "Team"
    field_mappings:
      id: "id"
      name: "name"
      description: "description"
      lead_name: "lead_name"

  - name: "skills_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT s.id, s.name, s.category, s.level_required, CONCAT(s.name, ' (', s.category, ')') as display_name FROM skills s"
    target_type: "Skill"
    field_mappings:
      id: "id"
      name: "name"
      category: "category"
      level_required: "level_required"
      display_name: "display_name"

  - name: "projects_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT p.id, p.name, p.description, p.status, p.priority, p.budget, u.full_name as creator_name, t.name as team_name FROM projects p LEFT JOIN users u ON p.created_by = u.id LEFT JOIN teams t ON p.team_id = t.id"
    target_type: "Project"
    field_mappings:
      id: "id"
      name: "name"
      description: "description"
      status: "status"
      priority: "priority"
      budget: "budget"
      creator_name: "creator_name"
      team_name: "team_name"

  - name: "tasks_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT t.id, t.title, t.description, t.status, t.priority, t.estimated_hours, t.actual_hours, p.name as project_name, u1.full_name as assigned_to_name, u2.full_name as created_by_name FROM tasks t LEFT JOIN projects p ON t.project_id = p.id LEFT JOIN users u1 ON t.assigned_to = u1.id LEFT JOIN users u2 ON t.created_by = u2.id"
    target_type: "Task"
    field_mappings:
      id: "id"
      title: "name"
      description: "description"
      status: "status"
      priority: "priority"
      estimated_hours: "estimated_hours"
      actual_hours: "actual_hours"
      project_name: "project_name"
      assigned_to_name: "assigned_to_name"
      created_by_name: "created_by_name"

  - name: "high_priority_projects"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT CONCAT('HIGH_PRIO_', p.id) as id, p.name, p.status, p.priority, p.budget, COUNT(t.id) as task_count FROM projects p LEFT JOIN tasks t ON p.id = t.project_id WHERE p.priority IN ('high', 'critical') AND p.budget > 100000 GROUP BY p.id, p.name, p.status, p.priority, p.budget HAVING task_count >= 2"
    target_type: "HighPriorityProject"
    field_mappings:
      id: "id"
      name: "name"
      status: "status"
      priority: "priority"
      budget: "budget"
      task_count: "task_count"

  - name: "skill_experts"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT CONCAT('EXPERT_', us.user_id, '_', us.skill_id) as id, u.full_name as expert_name, s.name as skill_name, us.proficiency, us.years_experience FROM user_skills us JOIN users u ON us.user_id = u.id JOIN skills s ON us.skill_id = s.id WHERE us.proficiency IN ('advanced', 'expert') AND us.years_experience >= 3"
    target_type: "SkillExpert"
    field_mappings:
      id: "id"
      expert_name: "expert_name"
      skill_name: "skill_name"
      proficiency: "proficiency"
      years_experience: "years_experience"
      name: "expert_name"

  - name: "team_leadership"
    rule_type: "relationship"
    relationship_type: "LEADS"
    direction: "outgoing"
    source_node:
      type: "User"
      key: "id"
      target_field: "id"
    target_node:
      type: "Team"
      key: "team_lead_id"
      target_field: "id"

  - name: "team_membership"
    rule_type: "relationship"
    relationship_type: "MEMBER_OF"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT tm.user_id, tm.team_id, tm.role, tm.joined_at FROM team_members tm"
    source_node:
      type: "User"
      key: "user_id"
      target_field: "id"
    target_node:
      type: "Team"
      key: "team_id"
      target_field: "id"
    properties:
      role: "role"
      joined_at: "joined_at"

  - name: "user_skill_proficiency"
    rule_type: "relationship"
    relationship_type: "HAS_SKILL"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT us.user_id, us.skill_id, us.proficiency, us.years_experience FROM user_skills us"
    source_node:
      type: "User"
      key: "user_id"
      target_field: "id"
    target_node:
      type: "Skill"
      key: "skill_id"
      target_field: "id"
    properties:
      proficiency: "proficiency"
      years_experience: "years_experience"

  - name: "project_creation"
    rule_type: "relationship"
    relationship_type: "CREATED"
    direction: "outgoing"
    source_node:
      type: "User"
      key: "created_by"
      target_field: "id"
    target_node:
      type: "Project"
      key: "id"
      target_field: "id"

  - name: "project_team_assignment"
    rule_type: "relationship"
    relationship_type: "ASSIGNED_TO"
    direction: "outgoing"
    source_node:
      type: "Project"
      key: "id"
      target_field: "id"
    target_node:
      type: "Team"
      key: "team_id"
      target_field: "id"

  - name: "task_assignment"
    rule_type: "relationship"
    relationship_type: "ASSIGNED_TO"
    direction: "outgoing"
    source_node:
      type: "Task"
      key: "id"
      target_field: "id"
    target_node:
      type: "User"
      key: "assigned_to"
      target_field: "id"

  - name: "task_project_relationship"
    rule_type: "relationship"
    relationship_type: "BELONGS_TO"
    direction: "outgoing"
    source_node:
      type: "Task"
      key: "id"
      target_field: "id"
    target_node:
      type: "Project"
      key: "project_id"
      target_field: "id"

  - name: "project_skill_requirements"
    rule_type: "relationship"
    relationship_type: "REQUIRES_SKILL"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT ps.project_id, ps.skill_id, ps.importance FROM project_skills ps"
    source_node:
      type: "Project"
      key: "project_id"
      target_field: "id"
    target_node:
      type: "Skill"
      key: "skill_id"
      target_field: "id"
    properties:
      importance: "importance"

  - name: "task_dependencies"
    rule_type: "relationship"
    relationship_type: "DEPENDS_ON"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT td.dependent_task_id, td.prerequisite_task_id, td.dependency_type FROM task_dependencies td"
    source_node:
      type: "Task"
      key: "dependent_task_id"
      target_field: "id"
    target_node:
      type: "Task"
      key: "prerequisite_task_id"
      target_field: "id"
    properties:
      dependency_type: "dependency_type"

  - name: "expert_skill_mastery"
    rule_type: "relationship"
    relationship_type: "EXPERT_IN"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT CONCAT('EXPERT_', us.user_id, '_', us.skill_id) as expert_id, us.skill_id FROM user_skills us WHERE us.proficiency IN ('advanced', 'expert') AND us.years_experience >= 3"
    source_node:
      type: "SkillExpert"
      key: "expert_id"
      target_field: "id"
    target_node:
      type: "Skill"
      key: "skill_id"
      target_field: "id"

logging:
  level: "${LOG_LEVEL:-info}"
  format: json
  output: stdout
  enable_performance_logs: true
  log_slow_queries: true
  slow_query_threshold: 1s

api:
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    max_age: 3600
  
  rate_limit:
    enabled: true
    requests_per_minute: 500
    burst: 100

  graphql:
    playground_enabled: "${GRAPHQL_PLAYGROUND_ENABLED:-true}"
    introspection_enabled: "${GRAPHQL_INTROSPECTION_ENABLED:-true}"
    complexity_limit: 2000

monitoring:
  health_check:
    enabled: true
    endpoint: "/api/health"
    include_database_status: true
  
  metrics:
    enabled: true
    endpoint: "/api/metrics"
    include_performance_metrics: true

security:
  enable_auth: false
  cors_enabled: true
  rate_limiting_enabled: true
  input_validation_enabled: true

demo:
  enabled: false
  message: "Railway production deployment with comprehensive project management data"