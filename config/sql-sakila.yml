
mysql:
  host: "127.0.0.1"
  port: 3308
  username: "sakila_user"
  password: "sakila123"
  database: "sakila"
  connection_mode: "existing"

  data_filtering:
    schema_discovery: true
    table_blacklist: ["film_text"]
    row_limit_per_table: 100
    query_timeout: 60

  security:
    read_only: true
    connection_timeout: 30
    query_timeout: 60
    max_connections: 3

  auto_generated_rules:
    enabled: true
    strategy:
      table_to_node: true
      foreign_keys_to_relations: true
      naming_convention:
        node_type_format: "Pascal"
        relation_type_format: "UPPER_SNAKE"
    table_overrides:
      film_actor:
      film_category:

neo4j:
  uri: "bolt://localhost:7688"
  user: "neo4j"
  password: "sakila123"
  
  batch_processing:
    batch_size: 1000
    commit_frequency: 5000
    memory_limit_mb: 512

