database:
  type: "mysql"
  mysql:
    host: "${MYSQL_HOST}"
    port: ${MYSQL_PORT:-3306}
    user: "${MYSQL_USER}"
    password: "${MYSQL_PASSWORD}"
    database: "${MYSQL_DATABASE}"
    
    connection_mode: existing
    
    data_filtering:
      schema_discovery: true
      table_whitelist: ["users", "products", "categories", "orders", "order_items", "teams", "skills", "projects", "tasks", "team_members", "user_skills", "project_skills", "task_dependencies", "activity_log"]
      table_blacklist: []
      row_limit_per_table: 10000
      query_timeout: 60
    
    security:
      read_only: true
      connection_timeout: 60
      query_timeout: 60
      max_connections: 20
      allow_production_connections: true
      allowed_hosts: ["*"]

neo4j:
  uri: "${NEO4J_URI:-bolt://localhost:7687}"
  user: "${NEO4J_USER:-neo4j}"
  password: "${NEO4J_PASSWORD}"
  max_connection_pool_size: 50
  connection_timeout: 30s
  max_transaction_retry_time: 30s

server:
  port: ${PORT:-3000}
  api_port: ${API_PORT:-8080}
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

demo:
  enabled: true
  auto_transform_on_start: true
  sample_data_loaded: true
  reset_on_restart: false
  show_demo_banner: true
  demo_scenario: "ecommerce_analytics"

transform_rules:
  - name: "users_to_graph"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT id, username, email, first_name, last_name, created_at, country, city FROM users WHERE is_active = 1"
    target_type: "User"
    field_mappings:
      id: "user_id"
      username: "username"
      email: "email"
      first_name: "first_name"
      last_name: "last_name"
      created_at: "registration_date"
      country: "country"
      city: "city"

  - name: "products_to_graph"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT p.id, p.name, p.description, p.price, p.stock_quantity, c.name as category_name, p.created_at FROM products p JOIN categories c ON p.category_id = c.id WHERE p.is_active = 1"
    target_type: "Product"
    field_mappings:
      id: "product_id"
      name: "product_name"
      description: "description"
      price: "price"
      stock_quantity: "stock"
      category_name: "category"
      created_at: "created_date"

  - name: "categories_to_graph"
    rule_type: "node"
    source:
      type: "table"
      value: "categories"
    target_type: "Category"
    field_mappings:
      id: "category_id"
      name: "category_name"
      description: "description"

  - name: "orders_to_graph"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT id, user_id, order_date, total_amount, status FROM orders"
    target_type: "Order"
    field_mappings:
      id: "order_id"
      user_id: "user_id"
      order_date: "order_date"
      total_amount: "total_amount"
      status: "order_status"

  - name: "user_orders"
    rule_type: "relationship"
    relationship_type: "PLACED_ORDER"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT user_id, id as order_id, order_date, total_amount, status FROM orders"
    source_node:
      type: "User"
      key: "user_id"
      target_field: "user_id"
    target_node:
      type: "Order"
      key: "order_id"
      target_field: "order_id"
    properties:
      order_date: "order_date"
      total_amount: "total_amount"
      status: "order_status"

  - name: "order_products"
    rule_type: "relationship"
    relationship_type: "CONTAINS_PRODUCT"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT oi.order_id, oi.product_id, oi.quantity, oi.unit_price FROM order_items oi"
    source_node:
      type: "Order"
      key: "order_id"
      target_field: "order_id"
    target_node:
      type: "Product"
      key: "product_id"
      target_field: "product_id"
    properties:
      quantity: "quantity"
      unit_price: "unit_price"

  - name: "product_categories"
    rule_type: "relationship"
    relationship_type: "BELONGS_TO_CATEGORY"
    direction: "outgoing"
    source:
      type: "query"
      value: "SELECT id as product_id, category_id FROM products"
    source_node:
      type: "Product"
      key: "product_id"
      target_field: "product_id"
    target_node:
      type: "Category"
      key: "category_id"
      target_field: "category_id"

  # Add project management data if available
  - name: "teams_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT t.id, t.name, t.description, u.full_name as lead_name FROM teams t LEFT JOIN users u ON t.team_lead_id = u.id"
    target_type: "Team"
    field_mappings:
      id: "id"
      name: "name"
      description: "description"
      lead_name: "lead_name"

  - name: "skills_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT s.id, s.name, s.category, s.level_required, CONCAT(s.name, ' (', s.category, ')') as display_name FROM skills s"
    target_type: "Skill"
    field_mappings:
      id: "id"
      name: "name"
      category: "category"
      level_required: "level_required"
      display_name: "display_name"

  - name: "projects_to_nodes"
    rule_type: "node"
    source:
      type: "query"
      value: "SELECT p.id, p.name, p.description, p.status, p.priority, p.budget, u.full_name as creator_name, t.name as team_name FROM projects p LEFT JOIN users u ON p.created_by = u.id LEFT JOIN teams t ON p.team_id = t.id"
    target_type: "Project"
    field_mappings:
      id: "id"
      name: "name"
      description: "description"
      status: "status"
      priority: "priority"
      budget: "budget"
      creator_name: "creator_name"
      team_name: "team_name"

processing:
  batch_size: 1000
  max_memory_mb: 1024
  parallel_workers: 4
  transaction_size: 500

logging:
  level: "${LOG_LEVEL:-info}"
  format: json
  output: stdout
  enable_performance_logs: true
  log_slow_queries: true
  slow_query_threshold: 1s

api:
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    max_age: 3600
  
  rate_limit:
    enabled: true
    requests_per_minute: 500
    burst: 100

  graphql:
    playground_enabled: "${GRAPHQL_PLAYGROUND_ENABLED:-true}"
    introspection_enabled: "${GRAPHQL_INTROSPECTION_ENABLED:-true}"
    complexity_limit: 2000

visualization:
  node_colors:
    User: "#3498db"
    Product: "#e74c3c"
    Category: "#f39c12"
    Order: "#2ecc71"
    Team: "#9b59b6"
    Skill: "#1abc9c"
    Project: "#34495e"
  
  relationship_colors:
    PLACED_ORDER: "#9b59b6"
    CONTAINS_PRODUCT: "#34495e"
    BELONGS_TO_CATEGORY: "#e67e22"
    MEMBER_OF: "#7ED321"
    HAS_SKILL: "#50E3C2"
    ASSIGNED_TO: "#BD10E0"
  
  layout:
    algorithm: "force"
    node_size_property: "degree"
    enable_clustering: true

monitoring:
  health_check:
    enabled: true
    endpoint: "/api/health"
    include_database_status: true
  
  metrics:
    enabled: true
    endpoint: "/api/metrics"
    include_performance_metrics: true

security:
  enable_auth: false
  cors_enabled: true
  rate_limiting_enabled: true
  input_validation_enabled: true

demo_info:
  description: "Railway demo with e-commerce platform showing users, products, orders, and categories + project management data"
  datasets:
    mysql_ecommerce:
      tables: ["users", "products", "categories", "orders", "order_items"]
      estimated_records: 
        users: 100
        products: 50
        categories: 10
        orders: 200
        order_items: 500
    
    mysql_project_management:
      tables: ["teams", "skills", "projects", "tasks", "team_members", "user_skills"]
      estimated_records:
        teams: 5
        skills: 20
        projects: 15
        tasks: 50
        team_members: 25
        user_skills: 100
  
  transformation_examples:
    - "Users → User nodes with profile information"
    - "Products → Product nodes with pricing and inventory"
    - "Orders → Order nodes with relationships to Users and Products"
    - "Categories → Product classification nodes"
    - "Teams → Project team nodes"
    - "Skills → Skill nodes with proficiency relationships"
  
  use_cases:
    - "E-commerce customer behavior analysis"
    - "Product recommendation systems"
    - "Project team skill matching"
    - "Order fulfillment optimization"
    - "Cross-selling analysis"