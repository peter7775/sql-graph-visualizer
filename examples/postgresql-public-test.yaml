
database:
  type: "postgresql"
  postgresql:
    
    host: "localhost"
    port: 5432
    user: "postgres"
    password: "password"
    database: "dvdrental"
    schema: "public"
    
    ssl:
      mode: "require"
      insecure_skip_verify: false
    
    application_name: "sql-graph-visualizer-test"
    statement_timeout: 60
    
    connection_mode: existing
    
    data_filtering:
      schema_discovery: true
      
      table_whitelist: [
        "customer", "film", "actor", "category", 
        "film_actor", "film_category", "rental", 
        "inventory", "store", "staff", "address", "city", "country"
      ]
      
      table_blacklist: [
        "payment",
        "rental_backup", "customer_backup"
      ]
      
      row_limit_per_table: 10000
      
      where_conditions:
        rental: "rental_date >= '2005-01-01' AND rental_date < '2006-01-01'"
        payment: "payment_date >= '2005-01-01' AND payment_date < '2006-01-01'"
        customer: "active = 1"
        film: "length IS NOT NULL AND length > 0"
        
      query_timeout: 60
    
    security:
      read_only: true
      connection_timeout: 30
      query_timeout: 60
      max_connections: 5
      allow_production_connections: true
      allowed_hosts: ["*"]
      forbidden_patterns: [
        "DROP", "DELETE", "UPDATE", "INSERT", "TRUNCATE", 
        "ALTER", "CREATE", "GRANT", "REVOKE"
      ]
    
    auto_generated_rules:
      enabled: true
      strategy:
        table_to_node: true
        foreign_keys_to_relations: true
        naming_convention:
          node_type_format: "PascalCase"
          relation_type_format: "UPPER_SNAKE"
      
      table_overrides:
        film_actor:
          relationship_type: "ACTED_IN"
        film_category:
          relationship_type: "BELONGS_TO_CATEGORY"
        inventory:
          relationship_type: "AVAILABLE_AT"
        rental:
          relationship_type: "RENTED"
        customer_address:
          skip: true
        staff_address:
          skip: true

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"
  batch_processing:
    batch_size: 500
    commit_frequency: 2500
    memory_limit_mb: 256

transform_rules:
  - name: "customers_to_person_nodes"
    rule_type: "node_creation"
    source:
      type: "table"
      value: "customer"
    nodes:
      - label: "Customer"
        properties:
          - source: "customer_id"
            target: "id"
          - source: "first_name"
            target: "first_name"
          - source: "last_name"
            target: "last_name"
          - source: "email"
            target: "email"
          - source: "active"
            target: "is_active"
          - source: "create_date"
            target: "created_at"
    priority: 1
  
  - name: "films_to_movie_nodes"
    rule_type: "node_creation"
    source:
      type: "table"
      value: "film"
    nodes:
      - label: "Film"
        properties:
          - source: "film_id"
            target: "id"
          - source: "title"
            target: "title"
          - source: "description"
            target: "description"
          - source: "release_year"
            target: "release_year"
          - source: "length"
            target: "duration_minutes"
          - source: "rating"
            target: "mpaa_rating"
          - source: "special_features"
            target: "features"
    priority: 1
  
  - name: "actors_to_person_nodes"
    rule_type: "node_creation"
    source:
      type: "table"
      value: "actor"
    nodes:
      - label: "Actor"
        properties:
          - source: "actor_id"
            target: "id"
          - source: "first_name"
            target: "first_name"
          - source: "last_name"
            target: "last_name"
    priority: 1
  
  - name: "categories_to_genre_nodes"
    rule_type: "node_creation"
    source:
      type: "table"
      value: "category"
    nodes:
      - label: "Genre"
        properties:
          - source: "category_id"
            target: "id"
          - source: "name"
            target: "genre_name"
    priority: 1
  
  - name: "film_actor_relationships"
    rule_type: "relationship_creation"
    source:
      type: "table"
      value: "film_actor"
    relationship_type: "ACTED_IN"
    source_node:
      type: "Actor"
      key: "id"
      target_field: "actor_id"
    target_node:
      type: "Film"
      key: "id"
      target_field: "film_id"
    priority: 2
  
  - name: "customer_rental_relationships"
    rule_type: "relationship_creation"
    source:
      type: "table"
      value: "rental"
    relationship_type: "RENTED"
    source_node:
      type: "Customer"
      key: "id"
      target_field: "customer_id"
    target_node:
      type: "Film"
      key: "id"
      target_field: "film_id"
    properties:
      rental_date: "rental_date"
      return_date: "return_date"
    priority: 3

auto_generated_rules:
  enabled: true
  strategy:
    table_to_node: true
    foreign_keys_to_relations: true
    naming_convention:
      node_type_format: "PascalCase"
      relation_type_format: "UPPER_SNAKE"
