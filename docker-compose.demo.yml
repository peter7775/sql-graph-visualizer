# Live benchmark demo:  make demo   (or: docker compose -f docker-compose.demo.yml up -d --build)
#
# Services
#   mysql-demo            MySQL 8.0 with the e-shop dataset (demo/mysql/*.sql, seeded on first start)
#   neo4j-demo            Neo4j 4.4 (required by the main graph visualization)
#   sql-graph-visualizer  the application, DEMO_MODE=true, config/demo-config.yml
#
# PostgreSQL, Redis and nginx from the previous demo setup were removed: the live
# benchmark demo only needs MySQL + Neo4j, and the removed services referenced files
# that do not exist in the repository (postgres init SQL, nginx.conf, ssl/).
#
# Ports are published on 127.0.0.1 only (DEMO_MODE allows CREATE/DROP INDEX through the
# unauthenticated API). Override with environment variables if a port is already taken:
#   DEMO_BIND_ADDR (default 127.0.0.1; use 0.0.0.0 to expose the demo on the network)
#   DEMO_APP_PORT (3000)   DEMO_API_PORT (8080)   DEMO_MYSQL_PORT (3306)
#   DEMO_NEO4J_HTTP_PORT (7474)   DEMO_NEO4J_BOLT_PORT (7687)
#
# Credentials are fixed (demo only) and must match config/demo-config.yml.

# Fixed project name: same container/volume names regardless of the checkout directory.
name: sql-graph-demo

services:
  mysql-demo:
    image: mysql:8.0
    container_name: mysql-demo
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --skip-log-bin
      - --max-connections=200
      # The dataset is ~55 MB; a small buffer pool keeps it fully cached and memory use low.
      - --innodb-buffer-pool-size=384M
      - --innodb-redo-log-capacity=256M
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: demopass123
      MYSQL_DATABASE: ecommerce_demo
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demopass123
    volumes:
      - mysql_demo_data:/var/lib/mysql
      # Executed in file-name order, only when the data volume is empty (first start / demo-reseed).
      - ./demo/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_MYSQL_PORT:-3306}:3306"
    healthcheck:
      # Pings over TCP: during the init/seed phase the temporary server runs with
      # --skip-networking, so this only succeeds once the seed has finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped
    networks:
      - demo-network

  neo4j-demo:
    image: neo4j:4.4
    container_name: neo4j-demo
    environment:
      NEO4J_AUTH: neo4j/demopass123
      NEO4J_dbms_memory_heap_initial__size: 384M
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_dbms_memory_pagecache_size: 128M
    volumes:
      - neo4j_demo_data:/data
    ports:
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_NEO4J_HTTP_PORT:-7474}:7474"
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p demopass123 'RETURN 1;'"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    networks:
      - demo-network

  sql-graph-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: sql-graph-visualizer-demo:latest
    container_name: sql-graph-demo
    # Unified CLI (bootstrap.InitAll + StartServers). The image default (start.sh -> legacy
    # cmd/main.go) is kept for Railway and does not use the shared bootstrap code.
    command: ["/app/sql-graph-visualizer-cli", "serve"]
    environment:
      GO_ENV: demo
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_PATH: /app/config/demo-config.yml
      VIZ_PORT: "3000"
      API_PORT: "8080"
      DEMO_MODE: "true"
    ports:
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_APP_PORT:-3000}:3000"
      - "${DEMO_BIND_ADDR:-127.0.0.1}:${DEMO_API_PORT:-8080}:8080"
    depends_on:
      mysql-demo:
        condition: service_healthy
      neo4j-demo:
        condition: service_healthy
    volumes:
      # Edit the config without rebuilding the image (restart the container to apply).
      - ./config/demo-config.yml:/app/config/demo-config.yml:ro
      # Benchmark results (used by the before/after comparison).
      - demo_app_data:/app/data
    healthcheck:
      # The health endpoint is served by the API server (:8080), not the UI server (:3000).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    networks:
      - demo-network

volumes:
  mysql_demo_data:
  neo4j_demo_data:
  demo_app_data:

networks:
  demo-network:
    driver: bridge
