<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Graph Visualization</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared theme styles -->
    <link rel="stylesheet" href="/static/css/theme.css">

    <style>
        #viz {
            width: 100%;
            height: 100vh;
            border: 1px solid var(--border-color);
        }

        .controls .row.g-3 {
            flex-wrap: wrap;
        }

        #perfOverlayStatus {
            white-space: nowrap;
        }
    </style>

    <!-- Vis.js for network visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body data-theme="light">
    <div class="container-fluid">
        <div class="controls d-flex justify-content-between align-items-center">
            <div class="row g-3 align-items-center flex-grow-1">
                <div class="col-auto">
                    <div class="search-container">
                        <input type="text" id="search" class="form-control" placeholder="Search node...">
                        <div id="searchResults" class="search-results"></div>
                    </div>
                </div>
                <div class="col-auto">
                    <select id="layout" class="form-select">
                        <option value="force">Force Layout</option>
                        <option value="hierarchical">Hierarchical</option>
                        <option value="circular">Circular</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button id="zoomIn" class="btn btn-outline-secondary">+</button>
                    <button id="zoomOut" class="btn btn-outline-secondary">-</button>
                    <button id="fit" class="btn btn-outline-secondary">Fit</button>
                    <button id="reload" class="btn btn-outline-secondary">Reload</button>
                </div>
                <div class="col-auto d-flex align-items-center">
                    <div class="form-check form-switch mb-0 me-2">
                        <input class="form-check-input" type="checkbox" id="perfOverlayToggle">
                        <label class="form-check-label" for="perfOverlayToggle">Performance overlay</label>
                    </div>
                    <select id="perfMetricSelect" class="form-select form-select-sm" style="width: auto;" disabled>
                        <option value="average_latency">Latency</option>
                        <option value="queries_per_second">Queries/sec</option>
                        <option value="hotspot_score">Hotspot score</option>
                        <option value="load_score">Load score</option>
                    </select>
                    <span id="perfOverlayStatus" class="text-muted small ms-2"></span>
                </div>
            </div>
            <div class="col-auto">
                <button id="themeToggle" class="btn btn-outline-primary">🌙 Dark</button>
            </div>
        </div>
        <div id="viz"></div>
    </div>

    <script src="/static/js/visualization.js?v=4"></script>
    <script src="/static/js/theme-toggle.js"></script>
</body>
</html>
